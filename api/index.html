<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advertisement Preview</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(92%, 700px );
      padding: 20px;
      background: white;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .15);
    }

    .label {
      color: #666;
      font-size: 14px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      color: white;
      background: #2563eb;
      border-radius: 6px;
      text-decoration: none;
    }

    .button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="label">Advertisement preview</p>

    <img
      src="https://pub-9106393a3bc14926b10613a0c98b892a.r2.dev/fol4/motorola14.gif"
      alt="Advertisement preview"
    >

    <a
      class="button"
      href="/api/redirect"
      rel="nofollow noopener noreferrer"
    >
      Continue to advertisement
    </a>
  </main>
</body>
</html>
